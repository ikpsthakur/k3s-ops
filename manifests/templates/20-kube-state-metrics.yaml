apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k3s-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-ops-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k3s-ops
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
      - persistentvolumes
      - persistentvolumeclaims
    verbs:
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - list
      - watch

  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-ops-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k3s-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-ops-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: ${NAMESPACE}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k3s-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: k3s-ops
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: k3s-ops

    spec:
      serviceAccountName: kube-state-metrics

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kube-state-metrics
          image: ${KUBE_STATE_METRICS_IMAGE}
          imagePullPolicy: IfNotPresent

          args:
            - --port=8080
            - --telemetry-port=8081
            - --resources=pods,nodes,deployments,statefulsets,daemonsets,replicasets,jobs,cronjobs,persistentvolumes,persistentvolumeclaims

          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534