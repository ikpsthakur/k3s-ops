apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: k3s-ops
spec:
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: k3s-ops
spec:
  serviceName: victoria-metrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
        app.kubernetes.io/part-of: k3s-ops
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-metrics
          image: ${VICTORIA_METRICS_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=${VM_RETENTION}
            - -httpListenAddr=:8428
            - -memory.allowedPercent=60
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victoria-metrics
          app.kubernetes.io/part-of: k3s-ops
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STORAGE_CLASS}
        resources:
          requests:
            storage: ${VM_STORAGE_SIZE}
