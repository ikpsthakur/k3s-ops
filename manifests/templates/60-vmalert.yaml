apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/part-of: k3s-ops
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: ${VMALERT_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - -datasource.url=http://victoria-metrics.${NAMESPACE}.svc:8428
            - -remoteRead.url=http://victoria-metrics.${NAMESPACE}.svc:8428
            - -remoteWrite.url=http://victoria-metrics.${NAMESPACE}.svc:8428
            - -notifier.url=http://alertmanager.${NAMESPACE}.svc:9093
            - -rule=/rules/*.yml
            - -evaluationInterval=${SCRAPE_INTERVAL}
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
