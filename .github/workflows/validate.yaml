name: Validate manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz

          sudo mv kubeconform /usr/local/bin/kubeconform

          envsubst --version
          kubeconform -v

      - name: Prepare CI environment
        run: |
          test -f .env.example
          cp .env.example .env

          sed -i \
            "s|^SMTP_PASSWORD=.*|SMTP_PASSWORD='ci-placeholder'|" \
            .env

      - name: Check repository files
        run: |
          test -x scripts/render.sh
          test -x scripts/validate.sh

          echo "Tracked templates:"
          find . \
            -path './.git' -prune -o \
            -path './.rendered' -prune -o \
            -type f -print |
            sort

      - name: Render manifests
        run: |
          rm -rf .rendered
          ./scripts/render.sh

          echo "Rendered manifests:"
          find .rendered -maxdepth 2 -type f -print | sort

      - name: Check alert templates
        run: |
          grep -R '\$labels' .rendered/40-alert-rules.yaml

          if grep -R '{{ \.' .rendered/40-alert-rules.yaml; then
            echo "ERROR: envsubst removed \$labels from vmalert templates."
            exit 1
          fi

      - name: Validate manifests
        run: |
          ./scripts/validate.sh

          kubeconform \
            -strict \
            -summary \
            .rendered/*.yaml